- xsdtype: ler:Afloebskomponent
  assertions:
  - name: brøndformTilladelse
    expression: not(ler:broendform) or normalize-space(ler:type) = 'brønd'
  - name: bunddiameterbreddeMåleenhedsrestriktion
    expression: not(ler:bunddiameterbredde) or ler:bunddiameterbredde/@uom = 'mm'
  - name: bundlængdeMåleenhedsrestriktion
    expression: not(ler:bundlaengde) or ler:bundlaengde/@uom = 'mm'
  - name: bundlængdeTilladelse
    expression: "not(ler:bundlaengde)\nor (\n  normalize-space(ler:type) = 'brønd'\n  and (normalize-space(ler:broendform) = 'kvadratisk' or normalize-space(ler:broendform) = 'rektangulær')\n)"
- xsdtype: ler:Afloebsledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
- xsdtype: ler:AndenKomponent
  assertions:
  - name: forsyningsartRestriktion
    expression: "not(\n  normalize-space(ler:forsyningsart)\n  = ('afløb', 'el', 'fjernvarme/fjernkøling', 'gas', 'olie', 'telekommunikation', 'vand')\n)"
- xsdtype: ler:AndenLedning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
  - name: forsyningsartRestriktion
    expression: "not(\n  normalize-space(ler:forsyningsart)\n  = ('afløb', 'el', 'fjernvarme/fjernkøling', 'gas', 'olie', 'telekommunikation', 'vand')\n)"
  - name: geometriVertikaleKoordinaterRestriktion
    expression: not($afterCutoff) or not($verticalUnknown)
  - name: udvendigBreddeMåleenhedsrestriktion
    expression: not(ler:udvendigBredde) or ler:udvendigBredde/@uom = 'mm'
  - name: udvendigDiameterBetingelse
    expression: "not($afterCutoff)\nor\n(\n  ler:udvendigDiameter\n  and not(ler:udvendigDiameter/@xsi:nil = 'true')\n  and normalize-space(ler:udvendigDiameter) != ''\n)"
  - name: udvendigHøjdeMåleenhedsrestriktion
    expression: not(ler:udvendigHoejde) or ler:udvendigHoejde/@uom = 'mm'
- xsdtype: ler:Elkomponent
  assertions:
  - name: relativNiveauTilladelse
    expression: not(ler:relativNiveau) or normalize-space(ler:type) = 'rørblok'
  - name: spændingsniveauMåleenhedsrestriktion
    expression: not(ler:spaendingsniveau) or ler:spaendingsniveau/@uom = 'kV'
- xsdtype: ler:Elledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    sub_assertions:
    - name: fareklasseSkalVæreMegetFarlig
      message: Fareklassen skal være meget farlig hvis elledningen har et spændingsniveau på 10 kV eller mere.
      expression: not(number(ler:spaendingsniveau) >= 10) or normalize-space(ler:fareklasse) = 'meget farlig'
    - name: fareklasseMåIkkeVæreMegetFarlig
      message: Fareklassen må ikke være meget farlig hvis elledningen har et spændingsniveau på mindre end 10 kV.
      expression: number(ler:spaendingsniveau) >= 10 or normalize-space(ler:fareklasse) != 'meget farlig'
  - name: spændingsniveauMåleenhedsrestriktion
    expression: not(ler:spaendingsniveau) or ler:spaendingsniveau/@uom = 'kV'
  - name: udvendigDiameterBetingelse
    expression: "not($afterCutoff)\nor\n(\n  ler:udvendigDiameter\n  and not(ler:udvendigDiameter/@xsi:nil = 'true')\n  and normalize-space(ler:udvendigDiameter) != ''\n)"
  - name: vejledendeDybdeRestriktion
    expression: "not($afterCutoff and $verticalUnknown)\nor\n(\n  ler:vejledendeDybde\n  and not(ler:vejledendeDybde/@xsi:nil = 'true')\n  and normalize-space(ler:vejledendeDybde) != ''\n)"
- xsdtype: ler:Gasledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    sub_assertions:
    - name: fareklasseSkalVæreMegetFarlig
      message: Fareklassen skal være meget farlig hvis gasledningen har et tryk på 19 bar eller mere.
      expression: not(number(ler:tryk) >= 19) or normalize-space(ler:fareklasse) = 'meget farlig'
    - name: fareklasseMåIkkeVæreMegetFarlig
      message: Fareklassen må ikke være meget farlig hvis gasledningen har et tryk på mindre end 19 bar.
      expression: number(ler:tryk) >= 19 or normalize-space(ler:fareklasse) != 'meget farlig'
  - name: trykMåleenhedsrestriktion
    expression: not(ler:tryk) or ler:tryk/@uom = 'bar'
- xsdtype: ler:Graveforespoergselssvar
  assertions:
  - name: forventetAfleveringstidspunktRestriktion
    expression: not(ler:forventetAfleveringstidspunkt) or normalize-space(ler:type) = 'udtaget til manuel behandling'
  - name: idRestriktion
    expression: matches(ler:id, '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')
  - name: indholdGM_ObjectSRIDrestriktion
    expression: not(.//*[@srsName][not(@srsName = 'http://www.opengis.net/def/crs/EPSG/0/7416')])
  - name: indholdKoteSRIDrestriktion
    expression: not(.//*[ends-with(local-name(), 'kote')][@srsName][not(@srsName = 'http://www.opengis.net/def/crs/EPSG/0/5799')])
  - name: indholdNilReasonRestriktion
    expression: not(.//*[@xsi:nil = 'true'][@nilReason][not(@nilReason = 'unknown')])
  - name: typeSupplerendeInfoBetingelse
    expression: normalize-space(ler:type) != 'ledningsoplysninger udleveres ikke' or ler:typeSupplerendeInfo
- xsdtype: ler:Informationsressource
  assertions:
  - name: formatRestriktion
    expression: '(normalize-space(ler:format) = ''CSV'' and ler:format/@type = ''text/csv'')

      or (normalize-space(ler:format) = ''DGN'' and ler:format/@type = ''application/octet-stream'')

      or (normalize-space(ler:format) = ''DOC'' and ler:format/@type = ''application/msword'')

      or (normalize-space(ler:format) = ''DOCX'' and ler:format/@type = ''application/vnd.openxmlformats-officedocument.wordprocessingml.document'')

      or (normalize-space(ler:format) = ''DWF'' and ler:format/@type = ''model/vnd.dwf'')

      or (normalize-space(ler:format) = ''DWG'' and ler:format/@type = ''image/vnd.dwg'')

      or (normalize-space(ler:format) = ''DXF'' and ler:format/@type = ''image/vnd.dxf'')

      or (normalize-space(ler:format) = ''IFC-SPF'' and ler:format/@type = ''application/x-step'')

      or (normalize-space(ler:format) = ''IFC-XML'' and ler:format/@type = ''application/xml'')

      or (normalize-space(ler:format) = ''JPEG'' and ler:format/@type = ''image/jpeg'')

      or (normalize-space(ler:format) = ''PDF'' and ler:format/@type = ''application/pdf'')

      or (normalize-space(ler:format) = ''SAT'' and ler:format/@type = ''application/octet-stream'')

      or (normalize-space(ler:format) = ''SHP'' and ler:format/@type = ''application/x-shapefile'')

      or (normalize-space(ler:format) = ''SKP'' and ler:format/@type = ''application/octet-stream'')

      or (normalize-space(ler:format) = ''TAB'' and ler:format/@type = ''application/x-tab'')

      or (normalize-space(ler:format) = ''TIFF'' and ler:format/@type = ''image/tiff'')

      or (normalize-space(ler:format) = ''XLS'' and ler:format/@type = ''application/vnd.ms-excel'')

      or (normalize-space(ler:format) = ''XLSX'' and ler:format/@type = ''application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'')'
  - name: geometriDatatyperestriktion
    sub_assertions: &id001
    - name: geometriTypeTilladt
      message: 'Geometrien skal have en af følgende typer: GM_Point, GM_MultiPoint, GM_Curve, GM_MultiCurve, GM_Surface eller GM_MultiSurface.'
      expression: 'not($geom)

        or local-name($geom) = (''Point'', ''MultiPoint'', ''LineString'', ''Curve'', ''MultiCurve'', ''Polygon'', ''Surface'', ''MultiSurface'')'
    - name: kurveLineærInterpolation
      message: Geometrien skal anvende lineær interpolation hvis dens type er GM_Curve eller GM_MultiCurve.
      expression: "not($geom)\nor not(local-name($geom) = ('Curve', 'MultiCurve'))\nor (\n  local-name($geom) = 'Curve'\n  and not($geom/gml:segments/*[not(local-name() = 'LineStringSegment')])\n)\nor (\n  local-name($geom) = 'MultiCurve'\n  and not($geom//gml:curveMember/*[\n    not(self::gml:LineString)\n    and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))\n  ])\n)"
    - name: fladePlanInterpolation
      message: Geometrien skal anvende 2-dimensionel interpolation ("planar interpolation") hvis dens type er GM_Surface eller GM_MultiSurface.
      expression: "not($geom)\nor not(local-name($geom) = ('Surface', 'MultiSurface'))\nor (\n  local-name($geom) = 'Surface'\n  and not($geom/gml:patches/*[not(self::gml:PolygonPatch)])\n)\nor (\n  local-name($geom) = 'MultiSurface'\n  and not($geom//gml:surfaceMember/*[not(self::gml:Polygon) and not(self::gml:Surface)])\n)"
    - name: polygonGrænseLineærInterpolation
      message: Geometriens grænser skal anvende lineær interpolation hvis geometriens type er GM_Surface eller GM_MultiSurface.
      expression: "not($geom)\nor not(local-name($geom) = 'Polygon')\nor not($geom/(gml:exterior | gml:interior)/*[\n  not(self::gml:LinearRing)\n  and not(\n    self::gml:Ring\n    and not(gml:curveMember/*[\n      not(self::gml:LineString)\n      and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))\n    ])\n  )\n])"
    - name: fladeGrænseLineærInterpolation
      message: Geometriens grænser skal anvende lineær interpolation hvis geometriens type er GM_Surface eller GM_MultiSurface.
      expression: "not($geom)\nor not(local-name($geom) = 'Surface')\nor not($geom/gml:patches/gml:PolygonPatch/(gml:exterior | gml:interior)/*[\n  not(self::gml:LinearRing)\n  and not(\n    self::gml:Ring\n    and not(gml:curveMember/*[\n      not(self::gml:LineString)\n      and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))\n    ])\n  )\n])"
    - name: multifladeGrænseLineærInterpolation
      message: Geometriens grænser skal anvende lineær interpolation hvis geometriens type er GM_Surface eller GM_MultiSurface.
      expression: "not($geom)\nor not(local-name($geom) = 'MultiSurface')\nor not($geom//gml:surfaceMember/(gml:Polygon | gml:Surface/gml:patches/gml:PolygonPatch)/(gml:exterior | gml:interior)/*[\n  not(self::gml:LinearRing)\n  and not(\n    self::gml:Ring\n    and not(gml:curveMember/*[\n      not(self::gml:LineString)\n      and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))\n    ])\n  )\n])"
  - name: stiRestriktion
    expression: 'not(starts-with(ler:sti, ''/''))

      and not(matches(ler:sti, ''^[a-zA-Z][a-zA-Z0-9+.-]*:''))'
- xsdtype: ler:Kontaktprofil
  assertions:
  - name: mailadresseBetingelse
    expression: ler:telefonnummer or ler:mailadresse
  - name: telefonnummerBetingelse
    expression: ler:mailadresse or ler:telefonnummer
- xsdtype: ler:Ledning
  variables:
  - name: ownRef
    expression: concat('#', @gml:id)
  assertions:
  - name: driftsstatusVoidrestriktion
    expression: not($afterCutoff) or not(ler:driftsstatus/@xsi:nil = 'true')
  - name: fareklasseVoidrestriktion
    expression: not($afterCutoff) or not(ler:fareklasse/@xsi:nil = 'true')
  - name: geometriBetingelse
    expression: 'exists(//ler:Ledningstrace/ler:indeholdtLedning[@xlink:href = $ownRef])

      or exists(//ler:Ledning/ler:indeholdtLedning[@xlink:href = $ownRef])

      or (ler:geometri and not(ler:geometri/@xsi:nil = ''true''))'
  - name: geometriDatatyperestriktion
    expression: 'not(ler:geometri)

      or ler:geometri/gml:LineString

      or (ler:geometri/gml:Curve and not(ler:geometri/gml:Curve/gml:segments/*[not(local-name() = ''LineStringSegment'')]))'
  - name: nøjagtighedsklasseBetingelse
    expression: '(ler:geometri and ler:noejagtighedsklasse)

      or (not(ler:geometri) and not(ler:noejagtighedsklasse))'
  - name: nøjagtighedsklasseVoidrestriktion
    expression: not($afterCutoff) or not(ler:noejagtighedsklasse/@xsi:nil = 'true')
  - name: udvendigDiameterMåleenhedsrestriktion
    expression: not(ler:udvendigDiameter) or ler:udvendigDiameter/@uom = 'mm'
  - name: udvendigDiameterVoidrestriktion
    expression: not($afterCutoff) or not(ler:udvendigDiameter/@xsi:nil = 'true')
- xsdtype: ler:LedningEllerLedningstrace
  variables:
  - name: etab
    expression: normalize-space(ler:etableringstidspunkt)
  - name: isYear
    expression: matches($etab, '^\d{4}$')
  - name: isYearMonth
    expression: matches($etab, '^\d{4}-\d{2}$')
  - name: isDate
    expression: matches($etab, '^\d{4}-\d{2}-\d{2}$')
  - name: afterCutoff
    expression: 'if ($isDate) then xs:date($etab) gt xs:date(''2023-07-01'')

      else if ($isYearMonth) then $etab gt ''2023-07''

      else if ($isYear) then number($etab) gt 2023

      else false()'
  assertions:
  - name: vejledendeDybdeMåleenhedsrestriktion
    expression: not(ler:vejledendeDybde) or ler:vejledendeDybde/@uom = 'mm'
- xsdtype: ler:Ledningskomponent
  variables:
  - name: geom
    expression: ler:geometri/*
  assertions:
  - name: geometriDatatyperestriktion
    sub_assertions: *id001
  - name: vejledendeDybdeMåleenhedsrestriktion
    expression: not(ler:vejledendeDybde) or ler:vejledendeDybde/@uom = 'mm'
- xsdtype: ler:Ledningstrace
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  - name: primaryForsyningsart
    expression: normalize-space(ler:forsyningsart[1])
  assertions:
  - name: breddeMåleenhedsrestriktion
    expression: not(ler:bredde) or ler:bredde/@uom = 'mm'
  - name: geometriDatatyperestriktion
    expression: "not(\n  ler:geometri//gml:curveMember/*[\n    not(self::gml:LineString)\n    and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))\n  ]\n)"
  - name: nøjagtighedsklasseBetingelse
    expression: boolean(ler:noejagtighedsklasse)
  - name: nøjagtighedsklasseVoidrestriktion
    expression: not($afterCutoff) or not(ler:noejagtighedsklasse/@xsi:nil = 'true')
- xsdtype: ler:LinearAnnotation
  assertions:
  - name: geometryDataTypeConstraint
    expression: 'not(ann:geometry)

      or ann:geometry/gml:LineString

      or (ann:geometry/gml:Curve and not(ann:geometry/gml:Curve/gml:segments/*[not(local-name() = ''LineStringSegment'')]))'
- xsdtype: ler:LinearDimension
  assertions:
  - name: geometryDataTypeConstraint
    expression: 'not(dim:dimensionLine)

      or dim:dimensionLine/gml:LineString

      or (dim:dimensionLine/gml:Curve and not(dim:dimensionLine/gml:Curve/gml:segments/*[not(local-name() = ''LineStringSegment'')]))'
- xsdtype: ler:Olieledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
  - name: trykMåleenhedsrestriktion
    expression: not(ler:tryk) or ler:tryk/@uom = 'bar'
- xsdtype: ler:Roerledning
  variables:
  - name: isCirkulaer
    expression: normalize-space(ler:tvaersnitsform) = 'cirkulær'
  assertions:
  - name: geometriVertikaleKoordinaterRestriktion
    expression: not($afterCutoff) or not($verticalUnknown)
  - name: udvendigBreddeBetingelse
    sub_assertions:
    - name: udvendigBreddeSkalAngives
      message: Den udvendige bredde skal være angivet hvis etableringstidspunktet er efter skæringsdatoen og tværsnitsformen ikke er cirkulær.
      expression: 'not($afterCutoff and not($isCirkulaer))

        or

        (ler:udvendigBredde and not(ler:udvendigBredde/@xsi:nil = ''true'') and normalize-space(ler:udvendigBredde) != '''')'
    - name: udvendigBreddeMåIkkeAngives
      message: Den udvendige bredde må ikke være angivet hvis tværsnitsformen er cirkulær.
      expression: not($isCirkulaer) or not(ler:udvendigBredde)
  - name: udvendigBreddeMåleenhedsrestriktion
    expression: not(ler:udvendigBredde) or ler:udvendigBredde/@uom = 'mm'
  - name: udvendigBreddeVoidrestriktion
    expression: not($afterCutoff) or not(ler:udvendigBredde/@xsi:nil = 'true')
  - name: udvendigDiameterBetingelse
    sub_assertions:
    - name: udvendigDiameterSkalAngives
      message: Den udvendige diameter skal være angivet hvis etableringstidspunktet er efter skæringsdatoen og tværsnitsformen er cirkulær.
      expression: 'not($afterCutoff and $isCirkulaer)

        or

        (ler:udvendigDiameter and not(ler:udvendigDiameter/@xsi:nil = ''true'') and normalize-space(ler:udvendigDiameter) != '''')'
    - name: udvendigDiameterMåIkkeAngives
      message: Den udvendige diameter må ikke være angivet hvis tværsnitsformen ikke er cirkulær.
      expression: $isCirkulaer or not(ler:udvendigDiameter)
  - name: udvendigHøjdeBetingelse
    sub_assertions:
    - name: udvendigHøjdeSkalAngives
      message: Den udvendige højde skal være angivet hvis etableringstidspunktet er efter skæringsdatoen og tværsnitsformen ikke er cirkulær.
      expression: 'not($afterCutoff and not($isCirkulaer))

        or

        (ler:udvendigHoejde and not(ler:udvendigHoejde/@xsi:nil = ''true'') and normalize-space(ler:udvendigHoejde) != '''')'
    - name: udvendigHøjdeMåIkkeAngives
      message: Den udvendige højde må ikke være angivet hvis tværsnitsformen er cirkulær.
      expression: not($isCirkulaer) or not(ler:udvendigHoejde)
  - name: udvendigHøjdeMåleenhedsrestriktion
    expression: not(ler:udvendigHoejde) or ler:udvendigHoejde/@uom = 'mm'
  - name: udvendigHøjdeVoidrestriktion
    expression: not($afterCutoff) or not(ler:udvendigHoejde/@xsi:nil = 'true')
- xsdtype: ler:Telekommunikationsledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
  - name: udvendigDiameterBetingelse
    expression: "not($afterCutoff)\nor\n(\n  ler:udvendigDiameter\n  and not(ler:udvendigDiameter/@xsi:nil = 'true')\n  and normalize-space(ler:udvendigDiameter) != ''\n)"
  - name: vejledendeDybdeRestriktion
    expression: "not($afterCutoff and $verticalUnknown)\nor\n(\n  ler:vejledendeDybde\n  and not(ler:vejledendeDybde/@xsi:nil = 'true')\n  and normalize-space(ler:vejledendeDybde) != ''\n)"
- xsdtype: ler:TermiskLedning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    sub_assertions:
    - name: fareklasseSkalVæreMegetFarlig
      message: Fareklassen skal være meget farlig hvis den termiske ledning har en temperatur på mere end 130 °C eller et tryk på 10 bar eller mere.
      expression: 'not(number(ler:temperatur) > 130 or number(ler:tryk) >= 10)

        or normalize-space(ler:fareklasse) = ''meget farlig'''
    - name: fareklasseMåIkkeVæreMegetFarlig
      message: Fareklassen må ikke være meget farlig hvis den termiske ledning har en temperatur på 130 °C eller mindre og et tryk på mindre end 10 bar.
      expression: '(number(ler:temperatur) > 130 or number(ler:tryk) >= 10)

        or normalize-space(ler:fareklasse) != ''meget farlig'''
  - name: temperaturMåleenhedsrestriktion
    expression: not(ler:temperatur) or ler:temperatur/@uom = 'Cel'
  - name: trykMåleenhedsrestriktion
    expression: not(ler:tryk) or ler:tryk/@uom = 'bar'
- xsdtype: ler:Vandkomponent
  assertions:
  - name: anborstedTilladelse
    expression: not(ler:anborsted) or normalize-space(ler:type) = 'tilslutningspunkt'
  - name: stutskoteTilladelse
    expression: not(ler:stutskote) or normalize-space(ler:type) = ('tapsted', 'ventil')
  - name: tapstedstypeTilladelse
    expression: not(ler:tapstedstype) or normalize-space(ler:type) = 'tapsted'
- xsdtype: ler:Vandledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
