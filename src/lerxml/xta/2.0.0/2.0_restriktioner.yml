- xsdtype: ler:Afloebskomponent
  assertions:
  - name: brøndformTilladelse
    expression: not(ler:broendform) or normalize-space(ler:type) = 'brønd'
  - name: bunddiameterbreddeMåleenhedsrestriktion
    expression: not(ler:bunddiameterbredde) or ler:bunddiameterbredde/@uom = 'mm'
  - name: bundlængdeMåleenhedsrestriktion
    expression: not(ler:bundlaengde) or ler:bundlaengde/@uom = 'mm'
  - name: bundlængdeTilladelse
    expression: "not(ler:bundlaengde)\nor (\n  normalize-space(ler:type) = 'brønd'\n  and (normalize-space(ler:broendform) = 'kvadratisk' or normalize-space(ler:broendform) = 'rektangulær')\n)"
- xsdtype: ler:Afloebsledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
- xsdtype: ler:AndenLedning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
  - name: forsyningsartRestriktion
    expression: "not(\n  normalize-space(ler:forsyningsart)\n  = ('afløb', 'el', 'fjernvarme/fjernkøling', 'gas', 'olie', 'telekommunikation', 'vand')\n)"
  - name: geometriVertikaleKoordinaterRestriktion
    expression: not($afterCutoff) or not($verticalUnknown)
  - name: udvendigBreddeMåleenhedsrestriktion
    expression: not(ler:udvendigBredde) or ler:udvendigBredde/@uom = 'mm'
  - name: udvendigDiameterBetingelse
    expression: "not($afterCutoff)\nor\n(\n  ler:udvendigDiameter\n  and not(ler:udvendigDiameter/@xsi:nil = 'true')\n  and normalize-space(ler:udvendigDiameter) != ''\n)"
  - name: udvendigHøjdeMåleenhedsrestriktion
    expression: not(ler:udvendigHoejde) or ler:udvendigHoejde/@uom = 'mm'
- xsdtype: ler:Elkomponent
  assertions:
  - name: spændingsniveauMåleenhedsrestriktion
    expression: not(ler:spaendingsniveau) or ler:spaendingsniveau/@uom = 'kV'
- xsdtype: ler:Elledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: '(number(ler:spaendingsniveau) >= 10 and normalize-space(ler:fareklasse) = ''meget farlig'')

      or (not(number(ler:spaendingsniveau) >= 10) and normalize-space(ler:fareklasse) != ''meget farlig'')'
  - name: spændingsniveauMåleenhedsrestriktion
    expression: not(ler:spaendingsniveau) or ler:spaendingsniveau/@uom = 'kV'
  - name: udvendigDiameterBetingelse
    expression: "not($afterCutoff)\nor\n(\n  ler:udvendigDiameter\n  and not(ler:udvendigDiameter/@xsi:nil = 'true')\n  and normalize-space(ler:udvendigDiameter) != ''\n)"
- xsdtype: ler:Gasledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: '(number(ler:tryk) >= 19 and normalize-space(ler:fareklasse) = ''meget farlig'')

      or (not(number(ler:tryk) >= 19) and normalize-space(ler:fareklasse) != ''meget farlig'')'
  - name: trykMåleenhedsrestriktion
    expression: not(ler:tryk) or ler:tryk/@uom = 'bar'
- xsdtype: ler:Graveforespoergselssvar
  assertions:
  - name: forventetAfleveringstidspunktRestriktion
    expression: not(ler:forventetAfleveringstidspunkt) or normalize-space(ler:type) = 'udtaget til manuel behandling'
  - name: idRestriktion
    expression: matches(ler:id, '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')
  - name: indholdGM_ObjectSRIDrestriktion
    expression: not(.//*[@srsName][not(@srsName = 'http://www.opengis.net/def/crs/EPSG/0/7416')])
  - name: indholdKoteSRIDrestriktion
    expression: not(.//*[ends-with(local-name(), 'kote')][@srsName][not(@srsName = 'http://www.opengis.net/def/crs/EPSG/0/5799')])
  - name: indholdNilReasonRestriktion
    expression: not(.//*[@xsi:nil = 'true'][@nilReason][not(@nilReason = 'unknown')])
  - name: typeSupplerendeInfoBetingelse
    expression: normalize-space(ler:type) != 'ledningsoplysninger udleveres ikke' or ler:typeSupplerendeInfo
- xsdtype: ler:Ledning
  variables:
  - name: ownRef
    expression: concat('#', @gml:id)
  assertions:
  - name: geometriBetingelse
    expression: 'exists(//ler:Ledningstrace/ler:indeholdtLedning[@xlink:href = $ownRef])

      or exists(//ler:Ledning/ler:indeholdtLedning[@xlink:href = $ownRef])

      or (ler:geometri and not(ler:geometri/@xsi:nil = ''true''))'
  - name: geometriDatatyperestriktion
    expression: 'not(ler:geometri)

      or ler:geometri/gml:LineString

      or (ler:geometri/gml:Curve and not(ler:geometri/gml:Curve/gml:segments/*[not(local-name() = ''LineStringSegment'')]))'
  - name: nøjagtighedsklasseVoidrestriktion
    expression: not($afterCutoff) or not(ler:noejagtighedsklasse/@xsi:nil = 'true')
  - name: udvendigDiameterMåleenhedsrestriktion
    expression: not(ler:udvendigDiameter) or ler:udvendigDiameter/@uom = 'mm'
- xsdtype: ler:LedningEllerLedningstrace
  variables:
  - name: etab
    expression: normalize-space(ler:etableringstidspunkt)
  - name: isYear
    expression: matches($etab, '^\d{4}$')
  - name: isYearMonth
    expression: matches($etab, '^\d{4}-\d{2}$')
  - name: isDate
    expression: matches($etab, '^\d{4}-\d{2}-\d{2}$')
  - name: afterCutoff
    expression: 'if ($isDate) then xs:date($etab) gt xs:date(''2023-07-01'')

      else if ($isYearMonth) then $etab gt ''2023-07''

      else if ($isYear) then number($etab) gt 2023

      else false()'
  assertions:
  - name: vejledendeDybdeMåleenhedsrestriktion
    expression: not(ler:vejledendeDybde) or ler:vejledendeDybde/@uom = 'mm'
- xsdtype: ler:Ledningskomponent
  assertions:
  - name: vejledendeDybdeMåleenhedsrestriktion
    expression: not(ler:vejledendeDybde) or ler:vejledendeDybde/@uom = 'mm'
- xsdtype: ler:Ledningstrace
  assertions:
  - name: breddeMåleenhedsrestriktion
    expression: not(ler:bredde) or ler:bredde/@uom = 'mm'
  - name: geometriDatatyperestriktion
    expression: "not(\n  ler:geometri//gml:curveMember/*[\n    not(self::gml:LineString)\n    and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))\n  ]\n)"
  - name: nøjagtighedsklasseVoidrestriktion
    expression: not($afterCutoff) or not(ler:noejagtighedsklasse/@xsi:nil = 'true')
- xsdtype: ler:Olieledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
  - name: trykMåleenhedsrestriktion
    expression: not(ler:tryk) or ler:tryk/@uom = 'bar'
- xsdtype: ler:Roerledning
  variables:
  - name: isCirkulaer
    expression: normalize-space(ler:tvaersnitsform) = 'cirkulær'
  assertions:
  - name: geometriVertikaleKoordinaterRestriktion
    expression: not($afterCutoff) or not($verticalUnknown)
  - name: udvendigBreddeMåleenhedsrestriktion
    expression: not(ler:udvendigBredde) or ler:udvendigBredde/@uom = 'mm'
  - name: udvendigHøjdeMåleenhedsrestriktion
    expression: not(ler:udvendigHoejde) or ler:udvendigHoejde/@uom = 'mm'
- xsdtype: ler:Telekommunikationsledning
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
  - name: udvendigDiameterBetingelse
    expression: "not($afterCutoff)\nor\n(\n  ler:udvendigDiameter\n  and not(ler:udvendigDiameter/@xsi:nil = 'true')\n  and normalize-space(ler:udvendigDiameter) != ''\n)"
- xsdtype: ler:TermiskLedning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: "(\n  (number(ler:temperatur) > 130 or number(ler:tryk) >= 10)\n  and normalize-space(ler:fareklasse) = 'meget farlig'\n)\nor\n(\n  not(number(ler:temperatur) > 130 or number(ler:tryk) >= 10)\n  and normalize-space(ler:fareklasse) != 'meget farlig'\n)"
  - name: temperaturMåleenhedsrestriktion
    expression: not(ler:temperatur) or ler:temperatur/@uom = 'Cel'
  - name: trykMåleenhedsrestriktion
    expression: not(ler:tryk) or ler:tryk/@uom = 'bar'
- xsdtype: ler:Vandledning
  variables:
  - name: zValues
    expression: 'for $pl in ler:geometri//gml:posList

      return tokenize(normalize-space($pl), ''\s+'')[position() mod 3 = 0]'
  - name: verticalUnknown
    expression: exists($zValues) and (every $z in $zValues satisfies $z = '-99')
  assertions:
  - name: fareklasseRestriktion
    expression: normalize-space(ler:fareklasse) != 'meget farlig'
