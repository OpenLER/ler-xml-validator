source: $FT/Foeringsroer.xml
assertions: []
branches:
  - name: convert to rektangulær
    xquery: |-
      replace value of node $doc//ler:tvaersnitsform with "rektangulær",
      delete node $doc//ler:udvendigDiameter,
      insert nodes (<ler:udvendigBredde uom="mm">300</ler:udvendigBredde>, <ler:udvendigHoejde uom="mm">200</ler:udvendigHoejde>) after $doc//ler:tvaersnitsform
    assertions: []
    branches:
      - name: remove udvendigHoejde
        xquery: delete node $doc//ler:udvendigHoejde
        assertions: [udvendigHøjdeBetingelse]
