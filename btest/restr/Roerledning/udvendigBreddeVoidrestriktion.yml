source: $FT/Føringsrør.xml
assertions: []
branches:
  - name: convert to rektangulær
    xquery: |-
      replace value of node $doc//ler:tvaersnitsform with "rektangulær",
      delete node $doc//ler:udvendigDiameter,
      insert nodes (<ler:udvendigBredde uom="mm">300</ler:udvendigBredde>, <ler:udvendigHoejde uom="mm">200</ler:udvendigHoejde>) after $doc//ler:tvaersnitsform
    assertions: []
    branches:
      - name: set udvendigBredde nil
        xquery: replace node $doc//ler:udvendigBredde with <ler:udvendigBredde uom="mm" xsi:nil="true"/>
        assertions: [udvendigBreddeBetingelse, udvendigBreddeVoidrestriktion]
        branches:
          - name: set 2022
            xquery: replace value of node $doc//ler:etableringstidspunkt with "2022"
            assertions: []
