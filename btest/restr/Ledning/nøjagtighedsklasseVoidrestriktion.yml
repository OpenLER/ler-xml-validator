source: $FT/Elledning24.xml
assertions: []
branches:
  - name: delete noejagtighedsklasse element
    xquery: delete node $doc//ler:noejagtighedsklasse
    assertions: [nøjagtighedsklasseBetingelse]

  - name: set noejagtighedsklasse nil
    xquery: replace node $doc//ler:noejagtighedsklasse with <ler:noejagtighedsklasse xsi:nil="true"/>
    assertions: [nøjagtighedsklasseVoidrestriktion]
    branches:
      - name: set 2022
        xquery: replace value of node $doc//ler:etableringstidspunkt with "2022"
        assertions: []
