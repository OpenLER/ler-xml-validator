# Ordbog: menneskelig restriktionstekst (fra featurekatalog/constraints/{version}/*.yml's
# "expression"-felt) -> XPath-udtryk. build_xta.py slår hver restriktions tekst op her
# for at generere src/lerxml/xta/{version}/{major.minor}_restriktioner.yml automatisk.
#
# Nøglen er selve teksten (normaliseret whitespace ved opslag), ikke regel-navnet -
# samme navn kan betyde noget forskelligt for forskellige xsdtyper (fx
# udvendigDiameterBetingelse for Elledning vs. Rørledning), men samme tekst betyder
# altid det samme, uanset hvilken feature type eller version den optræder i.

- text: Måleenheden for den vejledende dybde i forhold til terræn ved etablering skal være millimeter. Millimeter skal angives med symbolet mm [UCUM].
  expression: not(ler:vejledendeDybde) or ler:vejledendeDybde/@uom = 'mm'

- text: Driftsstatussen må ikke være void hvis etableringstidspunktet er efter skæringsdatoen.
  expression: not($afterCutoff) or not(ler:driftsstatus/@xsi:nil = 'true')

- text: Fareklassen må ikke være void hvis  etableringstidspunktet er efter skæringsdatoen.
  expression: not($afterCutoff) or not(ler:fareklasse/@xsi:nil = 'true')

- text: |-
    Geometrien skal være angivet hvis alle følgende betingelser er sande:
    * ledningen er ikke indeholdt i et ledningstracé
    * ledningen er ikke indeholdt i en anden ledning
  expression: |-
    exists(//ler:Ledningstrace/ler:indeholdtLedning[@xlink:href = $ownRef])
    or exists(//ler:Ledning/ler:indeholdtLedning[@xlink:href = $ownRef])
    or (ler:geometri and not(ler:geometri/@xsi:nil = 'true'))

- text: |-
    Geometrien skal anvende lineær interpolation.
    Note: I en GML-indkodning betyder det, at geometrien, som er en kurve, skal have en geometritype der er en af følgende [GML SF]:
    * gml:LineString
    * gml:Curve med segmenter af typen gml:LineStringSegment
  expression: |-
    not(ler:geometri)
    or ler:geometri/gml:LineString
    or (ler:geometri/gml:Curve and not(ler:geometri/gml:Curve/gml:segments/*[not(local-name() = 'LineStringSegment')]))

- text: |-
    Nøjagtighedsklassen for den horisontale placering skal være angivet hvis geometrien er angivet.
    Nøjagtighedsklassen for den horisontale placering må ikke være angivet hvis geometrien ikke er angivet.
  expression: |-
    (ler:geometri and ler:noejagtighedsklasse)
    or (not(ler:geometri) and not(ler:noejagtighedsklasse))

- text: |-
    Nøjagtighedsklassen for den vertikale placering skal være angivet hvis geometrien er angivet.
    Nøjagtighedsklassen for den vertikale placering må ikke være angivet hvis geometrien ikke er angivet.
  expression: |-
    (ler:geometri and ler:noejagtighedsklasseVertikal)
    or (not(ler:geometri) and not(ler:noejagtighedsklasseVertikal))

- text: |-
    Nøjagtighedsklassen for den vertikale placering skal være angivet.
    Note: Denne restriktion er nødvendig, da attribut "nøjagtighedsklasseVertikal" er defineret på LedningEllerLedningstrace med multiplicitet 0..1.
  expression: boolean(ler:noejagtighedsklasseVertikal)

- text: |-
    Nøjagtighedsklassen for den vertikale placering må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
    )
    or not(ler:noejagtighedsklasseVertikal/@xsi:nil = 'true')

- text: |-
    Nøjagtighedsklassen for den horisontale placering må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
    )
    or not(ler:noejagtighedsklasse/@xsi:nil = 'true')

- text: |-
    Nøjagtighedsklassen må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
    )
    or not(ler:noejagtighedsklasse/@xsi:nil = 'true')

- text: |-
    Nøjagtighedsklassen må ikke være void hvis etableringstidspunktet er efter skæringsdatoen.
    Note: m.a.o.: værdien for nøjagtighedsklassen skal være angivet hvis etableringstidspunktet er efter skæringsdatoen, selvom denne attribut er deklareret som voidable.
  expression: not($afterCutoff) or not(ler:noejagtighedsklasse/@xsi:nil = 'true')

- text: Måleenheden for den udvendige diameter skal være millimeter. Millimeter skal angives med symbolet mm [UCUM].
  expression: not(ler:udvendigDiameter) or ler:udvendigDiameter/@uom = 'mm'

- text: |-
    Den udvendige diameter må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer;
    * driftsstatussen er ikke under etablering.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
      and normalize-space(ler:driftsstatus) != 'under etablering'
    )
    or not(ler:udvendigDiameter/@xsi:nil = 'true')

- text: Måleenheden for spændingsniveauet skal være kilovolt. Kilovolt skal angives med symbolet kV [UCUM].
  expression: not(ler:spaendingsniveau) or ler:spaendingsniveau/@uom = 'kV'

- text: Den udvendige diameter skal være angivet hvis etableringstidspunktet er efter skæringsdatoen.
  expression: |-
    not($afterCutoff)
    or
    (
      ler:udvendigDiameter
      and not(ler:udvendigDiameter/@xsi:nil = 'true')
      and normalize-space(ler:udvendigDiameter) != ''
    )

- text: |-
    Den vejledende dybde skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * de vertikale koordinater i geometrien er ukendt-værdien på -99.
  expression: |-
    not($afterCutoff and $verticalUnknown)
    or
    (
      ler:vejledendeDybde
      and not(ler:vejledendeDybde/@xsi:nil = 'true')
      and normalize-space(ler:vejledendeDybde) != ''
    )

- text: |-
    Den vejledende dybde må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer;
    * driftsstatussen er ikke under etablering;
    * de vertikale koordinater i geometrien er ukendt-værdien på -99.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
      and normalize-space(ler:driftsstatus) != 'under etablering'
      and $verticalUnknown
    )
    or
    not(ler:vejledendeDybde/@xsi:nil = 'true')

- text: |-
    Den udvendige bredde skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * tværsnitsformen er ikke cirkulær.
    Den udvendige bredde må ikke være angivet hvis tværsnitsformen er cirkulær.
  expression: |-
    (
      not($afterCutoff and not($isCirkulaer))
      or
      (ler:udvendigBredde and not(ler:udvendigBredde/@xsi:nil = 'true') and normalize-space(ler:udvendigBredde) != '')
    )
    and
    (not($isCirkulaer) or not(ler:udvendigBredde))

- text: Måleenheden for den udvendige bredde skal være millimeter. Millimeter skal angives med symbolet mm [UCUM].
  expression: not(ler:udvendigBredde) or ler:udvendigBredde/@uom = 'mm'

- text: |-
    Den udvendige bredde må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer;
    * driftsstatussen er ikke under etablering.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
      and normalize-space(ler:driftsstatus) != 'under etablering'
    )
    or not(ler:udvendigBredde/@xsi:nil = 'true')

- text: |-
    Den udvendige diameter skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * tværsnitsformen er cirkulær.
    Den udvendige diameter må ikke være angivet hvis tværsnitsformen ikke er cirkulær.
  expression: |-
    (
      not($afterCutoff and $isCirkulaer)
      or
      (ler:udvendigDiameter and not(ler:udvendigDiameter/@xsi:nil = 'true') and normalize-space(ler:udvendigDiameter) != '')
    )
    and
    ($isCirkulaer or not(ler:udvendigDiameter))

- text: |-
    Den udvendige højde skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * tværsnitsformen er ikke cirkulær.
    Den udvendige højde må ikke være angivet hvis tværsnitsformen er cirkulær.
  expression: |-
    (
      not($afterCutoff and not($isCirkulaer))
      or
      (ler:udvendigHoejde and not(ler:udvendigHoejde/@xsi:nil = 'true') and normalize-space(ler:udvendigHoejde) != '')
    )
    and
    (not($isCirkulaer) or not(ler:udvendigHoejde))

- text: Måleenheden for den udvendige højde skal være millimeter. Millimeter skal angives med symbolet mm [UCUM].
  expression: not(ler:udvendigHoejde) or ler:udvendigHoejde/@uom = 'mm'

- text: |-
    Den udvendige højde må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer;
    * driftsstatussen er ikke under etablering.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
      and normalize-space(ler:driftsstatus) != 'under etablering'
    )
    or not(ler:udvendigHoejde/@xsi:nil = 'true')

- text: |-
    En vertikal koordinat i geometrien må ikke være ukendt-værdien på -99 hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer;
    * driftsstatussen er ikke under etablering;
    * den primære forsyningsart er ikke el;
    * den primære forsyningsart er ikke telekommunikation.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
      and normalize-space(ler:driftsstatus) != 'under etablering'
      and $primaryForsyningsart != 'el'
      and $primaryForsyningsart != 'telekommunikation'
    )
    or not($verticalUnknown)

- text: |-
    Den vejledende dybde skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * de vertikale koordinater i geometrien er ukendt-værdien på -99;
    * den primære forsyningsart er el eller telekommunikation.
  expression: |-
    not(
      $afterCutoff
      and $verticalUnknown
      and ($primaryForsyningsart = 'el' or $primaryForsyningsart = 'telekommunikation')
    )
    or
    (
      ler:vejledendeDybde
      and not(ler:vejledendeDybde/@xsi:nil = 'true')
      and normalize-space(ler:vejledendeDybde) != ''
    )

- text: |-
    Den vejledende dybde må ikke være void hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer;
    * driftsstatussen er ikke under etablering;
    * de vertikale koordinater i geometrien er ukendt-værdien på -99;
    * den primære forsyningsart er el eller telekommunikation.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
      and normalize-space(ler:driftsstatus) != 'under etablering'
      and $verticalUnknown
      and ($primaryForsyningsart = 'el' or $primaryForsyningsart = 'telekommunikation')
    )
    or not(ler:vejledendeDybde/@xsi:nil = 'true')

- text: Fareklassen må ikke være meget farlig.
  expression: normalize-space(ler:fareklasse) != 'meget farlig'

- text: |-
    Fareklassen skal være meget farlig hvis elledningen har et spændingsniveau på 10 kV eller mere.
    Fareklassen må ikke være meget farlig hvis elledningen har et spændingsniveau på mindre end 10 kV.
  expression: |-
    (number(ler:spaendingsniveau) >= 10 and normalize-space(ler:fareklasse) = 'meget farlig')
    or (not(number(ler:spaendingsniveau) >= 10) and normalize-space(ler:fareklasse) != 'meget farlig')

- text: |-
    Fareklassen skal være meget farlig hvis gasledningen har et tryk på 19 bar eller mere.
    Fareklassen må ikke være meget farlig hvis gasledningen har et tryk på mindre end 19 bar.
  expression: |-
    (number(ler:tryk) >= 19 and normalize-space(ler:fareklasse) = 'meget farlig')
    or (not(number(ler:tryk) >= 19) and normalize-space(ler:fareklasse) != 'meget farlig')

- text: |-
    Fareklassen skal være meget farlig hvis en eller flere af følgende betingelser er sande:
    * den termiske ledning har en temperatur på mere end 130 °C
    * den termiske ledning har et tryk på 10 bar eller mere
    Fareklassen må ikke være meget farlig hvis alle følgende betingelser er sande:
    * den termiske ledning har en temperatur på 130 °C eller mindre
    * den termiske ledning har et tryk på mindre end 10 bar
  expression: |-
    (
      (number(ler:temperatur) > 130 or number(ler:tryk) >= 10)
      and normalize-space(ler:fareklasse) = 'meget farlig'
    )
    or
    (
      not(number(ler:temperatur) > 130 or number(ler:tryk) >= 10)
      and normalize-space(ler:fareklasse) != 'meget farlig'
    )

- text: Måleenheden for trykket skal være bar. Bar skal angives med symbolet bar [UCUM].
  expression: not(ler:tryk) or ler:tryk/@uom = 'bar'

- text: Brøndformen må kun være angivet hvis typen er brønd.
  expression: not(ler:broendform) or normalize-space(ler:type) = 'brønd'

- text: Måleenheden for bunddiameterbredden skal være millimeter. Millimeter skal angives med symbolet mm [UCUM].
  expression: not(ler:bunddiameterbredde) or ler:bunddiameterbredde/@uom = 'mm'

- text: Måleenheden for bundlængden skal være millimeter. Millimeter skal angives med symbolet mm [UCUM].
  expression: not(ler:bundlaengde) or ler:bundlaengde/@uom = 'mm'

- text: |-
    Bundlængden må kun være angivet hvis alle følgende betingelser er sande:
    * typen er brønd
    * brøndformkoden er kvadratisk eller rektangulær
  expression: |-
    not(ler:bundlaengde)
    or (
      normalize-space(ler:type) = 'brønd'
      and (normalize-space(ler:broendform) = 'kvadratisk' or normalize-space(ler:broendform) = 'rektangulær')
    )

- text: |-
    En vertikal koordinat i geometrien må ikke være ukendt-værdien på -99 hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen;
    * ejerskabsforholdet er ejet af udleverende ledningsejer;
    * driftsstatussen er ikke under etablering.
  expression: |-
    not(
      $afterCutoff
      and (not(ler:ejerskabsforhold) or normalize-space(ler:ejerskabsforhold) = 'ejet af udleverende ledningsejer')
      and normalize-space(ler:driftsstatus) != 'under etablering'
    )
    or not($verticalUnknown)

- text: |-
    Måleenheden for bredden skal være millimeter.
    Millimeter skal angives med symbolet mm [UCUM].
  expression: not(ler:bredde) or ler:bredde/@uom = 'mm'

- text: |-
    Nøjagtighedsklassen for den horisontale placering skal være angivet.
    Note: Denne restriktion er nødvendig, da attribut "nøjagtighedsklasse" er defineret på LedningEllerLedningstrace med multiplicitet 0..1.
  expression: boolean(ler:noejagtighedsklasse)

- text: |-
    Geometrien skal anvende lineær interpolation.
    Note: I en GML-indkodning betyder det, at geometrien, som er en multikurve, skal består af segmenter som skal have en geometritype der er en af følgende [GML SF]:
    * gml:LineString
    * gml:Curve med segmenter af typen gml:LineStringSegment
  expression: |-
    not(
      ler:geometri//gml:curveMember/*[
        not(self::gml:LineString)
        and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))
      ]
    )

- text: |-
    Det forventede afleveringstidspunkt må ikke være angivet hvis typen af graveforespørgselssvaret ikke er "udtaget til manuel behandling".
    Det forventede afleveringstidspunkt må godt være angivet hvis typen af graveforespørgselssvaret er "udtaget til manuel behandling".
  expression: not(ler:forventetAfleveringstidspunkt) or normalize-space(ler:type) = 'udtaget til manuel behandling'

- text: |-
    id'et skal være en UUID, som defineret i [ITU-T X.667].
    Note: Bemærk, at en anbefaling i [ITU-T X.667] er følgende: "It is recommended that the hexadecimal representation used in all human-readable formats be restricted to lower-case letters. Software processing this representation is, however, required to accept both upper and lower case letters".
  expression: matches(ler:id, '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')

- text: |-
    En featuretype indeholdt i et graveforespørgselssvar skal anvende det sammensatte koordinatreferencesystem med URI http://www.opengis.net/def/crs/EPSG/0/7416 som koordinatreferencesystemet for attributter der har GM_Object eller en af dets subtyper som typer.
    Note 1: Koordinatreferencesystemet med URI http://www.opengis.net/def/crs/EPSG/0/7416 har som navn "ETRS89 / UTM zone 32N + DVR90 height".
    Note 2: GM_Object har bl.a. GM_Point, GM_Curve og GM_MultiCurve som subtyper, se også ISO 19107.
    Note 3: Det betyder, at fx Ledning.geometri og LinearDimension.dimensionLine skal anvende koordinatreferencesystemet med URI http://www.opengis.net/def/crs/EPSG/0/7416.
  expression: not(.//*[@srsName][not(@srsName = 'http://www.opengis.net/def/crs/EPSG/0/7416')])

- text: |-
    En featuretype indeholdt i et graveforespørgselssvar skal anvende det vertikale koordinatreferencesystemet med URI http://www.opengis.net/def/crs/EPSG/0/5799 som koordinatreferencesystemet for attributter der repræsenterer en kote.
    Note 1: Koordinatreferencesystemet med URI http://www.opengis.net/def/crs/EPSG/0/5799 har som navn "DVR90 height".
    Note 2: En attribut der repræsenterer en kote har DirectPosition som type.
    Note 3: Det betyder, at fx Gaskomponent.topkote skal anvende koordinatreferencesystemet med URI http://www.opengis.net/def/crs/EPSG/0/5799.
    Note 4: Ukendte vertikale koordinater angives vha. ukendt-værdien på -99. Bemærk at visse objekttyper indeholder en restriktion der ikke tillader at bruge denne værdi.
  expression: not(.//*[ends-with(local-name(), 'kote')][@srsName][not(@srsName = 'http://www.opengis.net/def/crs/EPSG/0/5799')])

- text: |-
    En egenskab af en featuretype indeholdt i graveforespørgselssvaret, indkodet som GML, skal have "unknown" som værdi for XML-attributten med navn "nilReason" hvis egenskaben er void og XML-attributten med navn "nilReason" er angivet.
    En egenskab af en featuretype indeholdt i graveforespørgselssvaret, indkodet som GML, behøver ikke at have en XML-attribut med navn "nilReason" hvis egenskaben er void.
    Note: Det betyder, at fx <ler:udvendigDiameter xsi:nil="true" nilReason="withheld" /> ikke er tilladt.
  expression: not(.//*[@xsi:nil = 'true'][@nilReason][not(@nilReason = 'unknown')])

- text: |-
    Supplerende information om graveforespørgsselsvaret skal være angivet hvis typen af graveforespørgsselsvaret er "ledningsoplysninger udleveres ikke".
    Supplerende information om graveforespørgsselsvaret må godt være angivet hvis typen af graveforespørgsselsvaret ikke er "ledningsoplysninger udleveres ikke".
  expression: normalize-space(ler:type) != 'ledningsoplysninger udleveres ikke' or ler:typeSupplerendeInfo

- text: En vertikal koordinat i geometrien må ikke være ukendt-værdien på -99 hvis etableringstidspunktet er efter skæringsdatoen.
  expression: not($afterCutoff) or not($verticalUnknown)

- text: |-
    Forsyningsarten må ikke være en af de prædefinerede værdier fra kodelisten Forsyningsart.
    Note: Hvis man har behov for at afgive oplysninger om en ledning som har en forsyningsart som er prædefineret i kodelisten Forsyningsart, så skal man i stedet for AndenLedning bruge den subklasse af Ledning som hører til den forsyningsart. Fx Telekommunikationsledning for forsyningsarten telekommunikation.
  expression: |-
    not(
      normalize-space(ler:forsyningsart)
      = ('afløb', 'el', 'fjernvarme/fjernkøling', 'gas', 'olie', 'telekommunikation', 'vand')
    )

- text: Måleenheden for temperaturen skal være grader celsius. Grader celsius skal angives med symbolet Cel [UCUM].
  expression: not(ler:temperatur) or ler:temperatur/@uom = 'Cel'

- text: Den udvendige diameter skal være angivet hvis  etableringstidspunktet er efter skæringsdatoen.
  expression: |-
    not($afterCutoff)
    or
    (
      ler:udvendigDiameter
      and not(ler:udvendigDiameter/@xsi:nil = 'true')
      and normalize-space(ler:udvendigDiameter) != ''
    )

- text: |-
    Den vejledende dybde skal være angivet hvis alle følgende betingelser er sande:
    * etableringstidspunktet er efter skæringsdatoen
    * de vertikale koordinater i geometrien er ukendt-værdien på -99
  expression: |-
    not($afterCutoff and $verticalUnknown)
    or
    (
      ler:vejledendeDybde
      and not(ler:vejledendeDybde/@xsi:nil = 'true')
      and normalize-space(ler:vejledendeDybde) != ''
    )

- text: |-
    Geometrien skal have en af følgende typer: GM_Point, GM_MultiPoint, GM_Curve, GM_MultiCurve, GM_Surface eller GM_MultiSurface.
    Geometrien skal anvende lineær interpolation hvis dens type er GM_Curve eller GM_MultiCurve.
    Note: I en GML-indkodning betyder det, at geometritypen skal være en af følgende [GML SF]:
    * gml:LineString
    * gml:Curve som består af segmenter af typen gml:LineStringSegment
    Note 2: En kurve kan være enkeltstående eller kan indgå i en flade, som del af en grænse.
    Geometrien skal anvende 2-dimensionel interpolation (på engelsk: "planar interpolation") hvis dens type er GM_Surface eller GM_MultiSurface.
    Note: I en GML-indkodning betyder det, at geometritypen skal være en af følgende [GML SF]:
    * gml:Polygon
    * gml:Surface som består af dele af typen gml:PolygonPatch
    Geometriens grænser skal anvende lineær interpolation hvis geometriens type er GM_Surface eller GM_MultiSurface.
    Note: I en GML-indkodning betyder det, at en grænse af en flade eller en multiflade skal have en af følgende geometrityper [GML SF]:
    * gml:LinearRing
    * gml:Ring som består af kurver der anvender lineær interpolation (se ovenfor)
  expression: |-
    not($geom)
    or local-name($geom) = ('Point', 'MultiPoint')
    or local-name($geom) = 'LineString'
    or (
      local-name($geom) = 'Curve'
      and not($geom/gml:segments/*[not(local-name() = 'LineStringSegment')])
    )
    or (
      local-name($geom) = 'MultiCurve'
      and not($geom//gml:curveMember/*[
        not(self::gml:LineString)
        and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))
      ])
    )
    or (
      local-name($geom) = 'Polygon'
      and not($geom/(gml:exterior | gml:interior)/*[
        not(self::gml:LinearRing)
        and not(
          self::gml:Ring
          and not(gml:curveMember/*[
            not(self::gml:LineString)
            and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))
          ])
        )
      ])
    )
    or (
      local-name($geom) = 'Surface'
      and not($geom/gml:patches/*[not(self::gml:PolygonPatch)])
      and not($geom/gml:patches/gml:PolygonPatch/(gml:exterior | gml:interior)/*[
        not(self::gml:LinearRing)
        and not(
          self::gml:Ring
          and not(gml:curveMember/*[
            not(self::gml:LineString)
            and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))
          ])
        )
      ])
    )
    or (
      local-name($geom) = 'MultiSurface'
      and not($geom//gml:surfaceMember/*[not(self::gml:Polygon) and not(self::gml:Surface)])
      and not($geom//gml:surfaceMember/(gml:Polygon | gml:Surface/gml:patches/gml:PolygonPatch)/(gml:exterior | gml:interior)/*[
        not(self::gml:LinearRing)
        and not(
          self::gml:Ring
          and not(gml:curveMember/*[
            not(self::gml:LineString)
            and not(self::gml:Curve and not(gml:segments/*[not(local-name() = 'LineStringSegment')]))
          ])
        )
      ])
    )

- text: |-
    Forsyningsarten må ikke være en af de prædefinerede værdier fra kodelisten Forsyningsart.
    Note: Hvis man har behov for at afgive oplysninger om en ledningskomponent som har en forsyningsart som er prædefineret i kodelisten Forsyningsart, så skal man i stedet for AndenKomponent bruge den subklasse af Ledningskomponent som hører til den forsyningsart. Fx Telekommunikationskomponent for forsyningsarten telekommunikation.
  expression: |-
    not(
      normalize-space(ler:forsyningsart)
      = ('afløb', 'el', 'fjernvarme/fjernkøling', 'gas', 'olie', 'telekommunikation', 'vand')
    )

- text: Det relative niveau må kun være angivet hvis typen er rørblok.
  expression: not(ler:relativNiveau) or normalize-space(ler:type) = 'rørblok'

- text: Anborstedet må kun være angivet hvis typen er tilslutningspunkt.
  expression: not(ler:anborsted) or normalize-space(ler:type) = 'tilslutningspunkt'

- text: 'Stutskoten må kun være angivet hvis typen er en af følgende: tapsted, ventil.'
  expression: not(ler:stutskote) or normalize-space(ler:type) = ('tapsted', 'ventil')

- text: Tapstedstypen må kun være angivet hvis typen er tapsted.
  expression: not(ler:tapstedstype) or normalize-space(ler:type) = 'tapsted'
