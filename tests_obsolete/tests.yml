- id: wrong-uom
  path: elledning.xml
  xquery: replace value of node /ler:Elledning/ler:spaendingsniveau/@uom with "m"
  expected_errors:
    - spændingsniveauMåleenhedsrestriktion

- id: missing-uom
  path: elledning.xml
  xquery: delete node /ler:Elledning/ler:spaendingsniveau/@uom
  expected_errors:
    - spændingsniveauMåleenhedsrestriktion

- id: multiple-changes
  path: elledning.xml
  xquery: |
    replace value of node $doc/ler:Elledning/ler:spaendingsniveau/@uom with "m",
    delete node $doc/ler:Elledning/ler:udvendigDiameter
  expected_errors:
    - spændingsniveauMåleenhedsrestriktion
    - udvendigDiameterBetingelse
